[project]
name = "xgraph"
version = "0.1.0"
authors = [
  { name = "XGraph contributors" },
  { name = "vladkens", email = "v.pronsky@gmail.com" },
]
description = "Independent X account relationship collection and analysis built from a twscrape source snapshot"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["twitter", "x", "scrape", "graph", "analysis", "snscrape"]
license = { text = "MIT" }
classifiers = [
  'Development Status :: 4 - Beta',
  'License :: OSI Approved :: MIT License',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
]
dependencies = [
  "aiosqlite>=0.17.0",
  # The collector defaults to the curl-cffi transport: it impersonates a real
  # browser's TLS fingerprint and negotiates HTTP/2, which the httpx fallback
  # does not. Shipping it as an extra would let a plain install fall back to a
  # transport X can distinguish from a browser. See docs/xgraph-technical-design.md.
  "curl-cffi>=0.7.0",
  "fake-useragent>=1.4.0",
  "httpx>=0.26.0",
  "loguru>=0.7.0",
  "pyotp>=2.9.0",
  "beautifulsoup4>=4.13.0",
  "py-machineid>=1.0.0",
  "asyncpg>=0.29.0",
  "aiokafka>=0.10.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
# Retained so `xgraph[curl]` keeps resolving; curl-cffi is a core dependency now.
curl = ["curl-cffi>=0.7.0"]

[dependency-groups]
dev = [
  "curl-cffi>=0.7.0",
  "httpx>=0.26.0",
  "pytest-asyncio>=0.23.3",
  "pytest-cov>=4.1.0",
  "pytest-httpx>=0.28.0",
  "pytest>=7.4.4",
  "rich>=13.0",
  "ruff>=0.1.11",
  "ty>=0.0.41",
]

[project.urls]
repository = "https://github.com/Showiix/XGraph"
upstream = "https://github.com/vladkens/twscrape"

[project.scripts]
twscrape = "twscrape.cli:run"

[build-system]
requires = ["hatchling>=1.9.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twscrape", "xgraph"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C4", "SIM"]
ignore = ["E501", "UP035", "SIM105"]

[tool.ty.environment]
python-version = "3.10"
python-platform = "all"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
all = "error"
missing-type-argument = "ignore"
missing-override-decorator = "ignore"
